name: Build and Push Mapserver Docker Images to GHCR

on:
#   push:
#     branches:
#       - main
#       - master
#     paths:
#       - CHAINGUARD/**
#       - UBI/**
#       - UBUNTU/**
#       - .github/workflows/build-push-ghcr.yml
  workflow_dispatch:
    inputs:
      environment:
        description: ECR environment to publish to
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PROD

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: ghcr-all-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chainguard-mapserver
            context: CHAINGUARD/MAPSERVER
            dockerfile: Dockerfile
            build_args: ""
            extra_tag: ""
          # - image: ubi-gdal
          #   context: UBI/GDAL
          #   dockerfile: Dockerfile
          # - image: ubi-gdal-oci-large
          #   context: UBI/GDAL-OCI-LARGE
          #   dockerfile: Dockerfile
          # - image: ubi-gdal-oci-mapserver
          #   context: UBI/GDAL-OCI-MAPSERVER
          #   dockerfile: Dockerfile
          # - image: ubi-gdal-oci-small
          #   context: UBI/GDAL-OCI-SMALL
          #   dockerfile: Dockerfile
          # - image: ubuntu-gdal-oci-mapserver
          #   context: UBUNTU/GDAL-OCI-MAPSERVER
          #   dockerfile: Dockerfile
          # - image: ubuntu-gdal-oci-ubuntu-full
          #   context: UBUNTU/GDAL-OCI-UBUNTU-FULL
          #   dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set ECR attributes
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          case "$TARGET_ENVIRONMENT" in
            DEV)
              echo "ROLE_TO_ASSUME=arn:aws-us-gov:iam::718787032875:role/github-actions-ecr-fim-mapserver" >> $GITHUB_ENV
              echo "ECR_REPOSITORY=fim-mapserver" >> $GITHUB_ENV
              echo "IMAGE_TAG=dev" >> $GITHUB_ENV
              ;;
            TEST)
              echo "ROLE_TO_ASSUME=arn:aws-us-gov:iam::276847049069:role/github-actions-ecr-fim-mapserver" >> $GITHUB_ENV
              echo "ECR_REPOSITORY=fim-mapserver" >> $GITHUB_ENV
              echo "IMAGE_TAG=test" >> $GITHUB_ENV
              ;;
            PROD)
              echo "ROLE_TO_ASSUME=arn:aws-us-gov:iam::648157167324:role/github-actions-ecr-fim-mapserver" >> $GITHUB_ENV
              echo "ECR_REPOSITORY=fim-mapserver" >> $GITHUB_ENV
              echo "IMAGE_TAG=prod" >> $GITHUB_ENV
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          echo 'ECR_REPOSITORY=fim-mapserver' >> "$GITHUB_ENV"

      - name: Compute lowercase owner
        id: vars
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          output-credentials: true

      # Hello from AWS: WhoAmI
      - name: Sts GetCallerIdentity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o /tmp/html.tpl

      - name: Scan with Trivy (Table)
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          trivy image --platform linux/amd64 --exit-code 0 --format table --severity CRITICAL,HIGH ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Scan with Trivy (JSON)
        id: scan_with_trivy_json
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          mkdir -p trivy-reports
          trivy image --platform linux/amd64 --exit-code 1 --severity CRITICAL,HIGH --format json -o trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-trivy-report.json ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Scan with Trivy (HTML)
        id: scan_with_trivy_html
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          trivy image --platform linux/amd64 --exit-code 0 --severity CRITICAL,HIGH --format template --template "@/tmp/html.tpl" -o trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-trivy-report.html ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Generate Markdown Summary from Trivy JSON
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPORT_PATH=trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-trivy-report.json
          SUMMARY=trivy-reports/summary.md

          if jq -e '.Results | all(.Vulnerabilities == null or .Vulnerabilities == [])' "$REPORT_PATH" > /dev/null; then
            echo "### Trivy Security Scan Summary" > "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "- No vulnerabilities found." >> "$SUMMARY"
          else
            CRIT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$REPORT_PATH")
            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$REPORT_PATH")
            OTHER=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity != "CRITICAL" and .Severity != "HIGH")] | length' "$REPORT_PATH")
            echo "### Trivy Security Scan Summary" > "$SUMMARY"
            echo "" >> "$SUMMARY"
            echo "- Critical: $CRIT" >> "$SUMMARY"
            echo "- High: $HIGH" >> "$SUMMARY"
            echo "- Other (Medium/Low/Unknown): $OTHER" >> "$SUMMARY"
          fi

      - name: Upload Trivy Reports to GitHub Release
        uses: softprops/action-gh-release@v1
        if: (github.event_name == 'push' || github.event_name == 'schedule') && always()
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: trivy-${{ matrix.image }}-${{ github.sha }}
          name: '${{ matrix.image }} ${{ github.sha }} Container Security Scan'
          body_path: trivy-reports/summary.md
          files: |
            trivy-reports/${{ matrix.image }}-${{ github.sha }}-trivy-report.json
            trivy-reports/${{ matrix.image }}-${{ github.sha }}-trivy-report.html

      - name: Block Push to GitHub Container Registry if Vulnerabilities Found
        if: steps.scan_with_trivy_json.outcome == 'failure'
        run: |
          echo "Critical or High vulnerabilities detected. Blocking push to GitHub Container Registry."
          exit 1

      - name: Tag and Push Image to GitHub Container Registry
        if: steps.scan_with_trivy_json.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME='${{ matrix.image }}'
          IMAGE_TAG='${{ github.sha }}'
          TAGS='${{ steps.meta.outputs.tags }}'

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

          if [[ -n '${{ matrix.extra_tag }}' ]]; then
            extra_tag="ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}:${{ matrix.extra_tag }}"
            docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "$extra_tag"
            docker push "$extra_tag"
          fi

      - name: Tag and Push Image to Amazon ECR
        if: steps.scan_with_trivy_json.outcome == 'success'
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ecr_image="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker tag "${IMAGE_NAME}:${SOURCE_IMAGE_TAG}" "${ecr_image}:latest"
          docker tag "${IMAGE_NAME}:${SOURCE_IMAGE_TAG}" "${ecr_image}:${ECR_IMAGE_TAG}"

          docker push "${ecr_image}:latest"
          docker push "${ecr_image}:${ECR_IMAGE_TAG}"

      - name: ECR logout
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
