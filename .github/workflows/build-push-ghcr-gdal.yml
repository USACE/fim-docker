name: Build and Push Mapserver Docker Images to GHCR

on:
  # push:
  #   branches:
  #     - main
  #     - master
  #   tags:
  #     - "v*"
  #   paths:
  #     - CHAINGUARD/**
  #     - .github/workflows/build-push-ghcr.yml

  workflow_dispatch:
    inputs:
      environment:
        description: GHCR environment tag to publish
        required: true
        type: choice
        options:
          - DEV
          - TEST
          - PROD

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-all-images-${{ github.ref }}-${{ inputs.environment || 'branch' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-scan-and-push:
    name: Build, Scan, and Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Full-featured GDAL image, including Oracle Instant Client / OCI support.
          - image: chainguard-gdal
            context: CHAINGUARD/GDAL
            dockerfile: Dockerfile
            build_args: |
              BUILD_JOBS=8
              ENABLE_OCI=ON
              ENABLE_TILEDB=ON
              ENABLE_SFCGAL=ON
              ENABLE_NETCDF=ON
              ENABLE_POSTGRESQL=ON
              ENABLE_ARROW=ON
              ENABLE_HDF5=ON
              ENABLE_GEOS=ON
            extra_tag: ""

          # Full-featured GDAL image without Oracle Instant Client / OCI support.
          - image: chainguard-gdal-no-oci
            context: CHAINGUARD/GDAL
            dockerfile: Dockerfile
            build_args: |
              BUILD_JOBS=8
              ENABLE_OCI=OFF
              ENABLE_TILEDB=ON
              ENABLE_SFCGAL=ON
              ENABLE_NETCDF=ON
              ENABLE_POSTGRESQL=ON
              ENABLE_ARROW=ON
              ENABLE_HDF5=ON
              ENABLE_GEOS=ON
            extra_tag: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image and environment attributes
        id: vars
        shell: bash
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment || 'DEV' }}
        run: |
          set -euo pipefail

          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          environment_lc="$(printf '%s' "${SELECTED_ENVIRONMENT}" | tr '[:upper:]' '[:lower:]')"

          case "${environment_lc}" in
            dev|test|prod)
              ;;
            *)
              echo "Unsupported environment: ${SELECTED_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac

          echo "owner_lc=${owner_lc}" >> "${GITHUB_OUTPUT}"
          echo "environment_lc=${environment_lc}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      
      - name: Log in to Chainguard Registry
        uses: docker/login-action@v3
        with:
          registry: cgr.dev
          username: ${{ secrets.CGR_USERNAME }}
          password: ${{ secrets.CGR_PASSWORD }}
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.vars.outputs.environment_lc }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build the image locally so Trivy scans the exact artifact before it is
      # promoted to GHCR. Registry-backed cache is exported independently.
      - name: Build image and export BuildKit cache
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}:buildcache-amd64-${{ steps.vars.outputs.environment_lc }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}:buildcache-amd64-${{ steps.vars.outputs.environment_lc }},mode=max

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          curl -sfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

          curl -fsSL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl \
            -o /tmp/trivy-html.tpl

          trivy --version

      - name: Scan with Trivy - table output
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          trivy image \
            --platform linux/amd64 \
            --exit-code 0 \
            --format table \
            --severity CRITICAL,HIGH \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Scan with Trivy - JSON report
        id: scan_with_trivy_json
        continue-on-error: true
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p trivy-reports

          trivy image \
            --platform linux/amd64 \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --format json \
            --output "trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-trivy-report.json" \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Scan with Trivy - HTML report
        if: always()
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p trivy-reports

          trivy image \
            --platform linux/amd64 \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            --format template \
            --template "@/tmp/trivy-html.tpl" \
            --output "trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-trivy-report.html" \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Generate Trivy Markdown summary
        if: always()
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          report_path="trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-trivy-report.json"
          summary_path="trivy-reports/${IMAGE_NAME}-${IMAGE_TAG}-summary.md"

          {
            echo "### Trivy Security Scan Summary"
            echo
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
          } > "${summary_path}"

          if [[ ! -f "${report_path}" ]]; then
            echo "- JSON report was not generated." >> "${summary_path}"
            cat "${summary_path}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if jq -e \
            '.Results | all(.Vulnerabilities == null or .Vulnerabilities == [])' \
            "${report_path}" > /dev/null; then
            echo "- No vulnerabilities found at CRITICAL or HIGH severity." >> "${summary_path}"
          else
            critical_count="$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "${report_path}")"
            high_count="$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "${report_path}")"
            other_count="$(jq '[.Results[].Vulnerabilities[]? | select(.Severity != "CRITICAL" and .Severity != "HIGH")] | length' "${report_path}")"

            {
              echo "- Critical: ${critical_count}"
              echo "- High: ${high_count}"
              echo "- Other (Medium/Low/Unknown): ${other_count}"
            } >> "${summary_path}"
          fi

          cat "${summary_path}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Trivy reports as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}-${{ github.sha }}
          path: |
            trivy-reports/${{ matrix.image }}-${{ github.sha }}-trivy-report.json
            trivy-reports/${{ matrix.image }}-${{ github.sha }}-trivy-report.html
            trivy-reports/${{ matrix.image }}-${{ github.sha }}-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Block GHCR push if critical or high vulnerabilities are found
        if: steps.scan_with_trivy_json.outcome == 'failure'
        shell: bash
        run: |
          echo "Critical or High vulnerabilities were detected."
          echo "The final image will not be pushed to GHCR."
          exit 1

      - name: Tag and push image to GitHub Container Registry
        if: steps.scan_with_trivy_json.outcome == 'success'
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue

            echo "Publishing ${tag}"
            docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${tag}"
            docker push "${tag}"
          done <<< "${METADATA_TAGS}"

          if [[ -n "${{ matrix.extra_tag }}" ]]; then
            extra_tag="ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}:${{ matrix.extra_tag }}"

            echo "Publishing ${extra_tag}"
            docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${extra_tag}"
            docker push "${extra_tag}"
          fi

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  release:
    name: Create GitHub Release
    needs: build-scan-and-push
    runs-on: ubuntu-latest

    # Release creation occurs only from a pushed version tag.
    # Example: git tag -a v3.13.3 -m "Release 3.13.3"
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Trivy report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -d '' release_files < <(
            find release-assets \
              -type f \
              \( -name '*.json' -o -name '*.html' -o -name '*.md' \) \
              -print0
          )

          if [[ "${#release_files[@]}" -eq 0 ]]; then
            echo "No release assets were found." >&2
            exit 1
          fi

          release_title="GDAL Container Images ${RELEASE_TAG}"

          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Uploading or replacing release assets."

            gh release upload "${RELEASE_TAG}" \
              "${release_files[@]}" \
              --clobber \
              --repo "${REPOSITORY}"
          else
            echo "Creating GitHub Release ${RELEASE_TAG}."

            gh release create "${RELEASE_TAG}" \
              "${release_files[@]}" \
              --title "${release_title}" \
              --generate-notes \
              --repo "${REPOSITORY}"
          fi