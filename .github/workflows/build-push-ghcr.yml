name: Build and Push All Docker Images to GHCR

on:
#   push:
#     branches:
#       - main
#       - master
#     paths:
#       - CHAINGUARD/**
#       - UBI/**
#       - UBUNTU/**
#       - .github/workflows/build-push-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-all-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chainguard-gdal
            context: CHAINGUARD/GDAL
            dockerfile: Dockerfile
            build_args: ""
            extra_tag: ""
          - image: chainguard-gdal
            context: CHAINGUARD/GDAL
            dockerfile: Dockerfile
            build_args: |
              ENABLE_OCI=OFF
            extra_tag: no-oci
          - image: chainguard-mapserver
            context: CHAINGUARD/MAPSERVER
            dockerfile: Dockerfile
            build_args: ""
            extra_tag: ""
          # - image: ubi-gdal
          #   context: UBI/GDAL
          #   dockerfile: Dockerfile
          # - image: ubi-gdal-oci-large
          #   context: UBI/GDAL-OCI-LARGE
          #   dockerfile: Dockerfile
          # - image: ubi-gdal-oci-mapserver
          #   context: UBI/GDAL-OCI-MAPSERVER
          #   dockerfile: Dockerfile
          # - image: ubi-gdal-oci-small
          #   context: UBI/GDAL-OCI-SMALL
          #   dockerfile: Dockerfile
          # - image: ubuntu-gdal-oci-mapserver
          #   context: UBUNTU/GDAL-OCI-MAPSERVER
          #   dockerfile: Dockerfile
          # - image: ubuntu-gdal-oci-ubuntu-full
          #   context: UBUNTU/GDAL-OCI-UBUNTU-FULL
          #   dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase owner
        id: vars
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ matrix.extra_tag != '' && format('ghcr.io/{0}/{1}:{2}', steps.vars.outputs.owner_lc, matrix.image, matrix.extra_tag) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
